

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>تفعيل البريد الإلكتروني - قطارات مصر</title>

    <header class="header">
        <div class="header-container">
            <div class="logo">

            <nav class="navbar">

    <section class="verify-section">

        <div class="train-icon"></div>

            <p class="info-text">من فضلك أدخل كود التفعيل المرسل إلى بريدك الإلكتروني.</p>

            <form>

                <input type="text" id="code" placeholder="أدخل كود التفعيل">

                <button type="submit" class="btn-gold">تأكيد</button>

            <p class="resend">
