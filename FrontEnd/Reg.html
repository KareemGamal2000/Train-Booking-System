

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد - قطارات مصر</title>
    <link rel="stylesheet" href="Reg.css">
</head>
<body>
    
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="Images/Logo.png" alt="Train Logo">
            </div>
            <nav class="navbar">
                <ul>
                    <li><a href="Home.html">الرئيسية</a></li>
                    <li><a href="Login.html">تسجيل الدخول </a></li>
                    <li><a href="Reg.html">تسجيل جديد</a></li>
                    <li><a href="Contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    
    <section class="login-section">
        <div class="train-line"></div>
        <div class="train-icon"></div>

        <div class="login-form">
            <h2>تسجيل جديد</h2>
            <form id="register-form">

                <input type="text" id="firstName" placeholder="الاسم الأول">
                <p class="error-msg" id="firstName-error"></p>

                <input type="text" id="lastName" placeholder="الاسم الأخير">
                <p class="error-msg" id="lastName-error"></p>

                <input type="int" id="phone" placeholder="رقم الموبايل">
                <p class="error-msg" id="phone-error"></p>

                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <p class="error-msg" id="email-error"></p>
            
                <input type="password" id="password" placeholder="كلمة المرور">
                <p class="error-msg" id="password-error"></p>
            
                <button type="submit" class="btn-gold">تسجيل</button>
            </form>
        </div>
    </section>

    
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 قطارات مصر. جميع الحقوق محفوظة.</p>
            <p>تابعنا على: 
                <a href="#">فيسبوك</a> |
                <a href="#">تويتر</a> |
                <a href="#">انستجرام</a>
            </p>
        </div>
    </footer>

    <script src="Reg.js"></script>
</body>
</html>
