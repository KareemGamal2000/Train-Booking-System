<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرحلات المتاحة - قطارات مصر</title>
    <link rel="stylesheet" href="Search.css">
    <!-- تأكد من وجود ملف Search.css لتنسيق البطاقات -->
    <style>
        /* إضافة فئة لونية مساعدة لتتوافق مع التحديثات في Search.js وتعديلات العنوان */
        /* تم تعريف text-gold في Search.css، لا حاجة لإضافة نمط داخلي */
        .text-gold {
             color: #b38b2a; /* ذهبي داكن */
             font-weight: bold;
        }
    </style>
</head>
<body>

    
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <!-- استخدام شعار افتراضي باللون الذهبي -->
                <img src="https://placehold.co/220x60/d4af37/ffffff?text=Train+Logo" alt="Train Logo" onerror="this.onerror=null; this.src='https://placehold.co/220x60/d4af37/ffffff?text=Train+Logo';">
            </div>
            <nav class="navbar">
                <ul>
                    <li><a href="Home.html">الرئيسية</a></li>
                    <li><a href="Login.html">تسجيل الدخول</a></li>
                    <li><a href="Reg.html">تسجيل جديد</a></li>
                    <li><a href="Contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    
    <section class="results-section">
        <!-- عنوان يتم تحديثه بواسطة JavaScript -->
        <h2 class="title" id="results-title">الرحلات المتاحة</h2>

        <!-- الحاوية التي سيتم ملؤها ببطاقات الرحلات بواسطة Search.js -->
        <div id="results-section">
            <!-- سيتم إضافة بطاقات الرحلات هنا ديناميكياً -->
            <p style="text-align: center;">جاري عرض نتائج البحث...</p>
        </div>

    </section>

    <footer class="footer">
        <p>&copy; 2025 قطارات مصر. جميع الحقوق محفوظة.</p>
        <p>
            تابعنا على:
            <a href="#">فيسبوك</a> |
            <a href="#">تويتر</a> |
            <a href="#">انستجرام</a>
        </p>
    </footer>

    <!-- ** موديل اختيار الدرجة (Class Selection Modal) ** -->
    <div id="classSelectionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeClassSelectionModal()">&times;</span>
            <h3 class="modal-title">اختر درجة الحجز</h3>
            <p class="modal-subtitle">يرجى اختيار الدرجة والسعر المناسبين للرحلة.</p>
            
            <div id="classOptionsContainer" class="class-options-container">
                <!-- خيارات الدرجات -->
            </div>

        </div>
    </div>
    <!-- نهاية موديل اختيار الدرجة -->

    <!-- ** موديل عرض المسار الكامل والتتبع (Trip Map Modal) ** -->
    <div id="tripMapModal" class="modal">
        <div class="modal-content large-modal">
            <span class="close-btn" onclick="closeTripMapModal()">&times;</span>
            <h3 class="modal-title" id="tripMapTitle">مسار الرحلة وتتبع القطار</h3>
            
            <div id="tripMapContainer">
                <!-- شريط التتبع الديناميكي وقائمة المحطات ستظهر هنا -->
            </div>

        </div>
    </div>
    <!-- نهاية موديل عرض المسار -->


    <!-- ربط ملف JavaScript الجديد -->
    <script src="Search.js"></script>
</body>
</html>
