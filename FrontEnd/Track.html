

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع الرحلة - قطارات مصر</title>
    <link rel="stylesheet" href="Track.css">
</head>

<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="Images/Logo.png" alt="Train Logo">
            </div>
            <nav class="navbar">
                <ul>
                    <li><a href="Home.html">الرئيسية</a></li>
                    <li><a href="Login.html">تسجيل الدخول</a></li>
                    <li><a href="Reg.html">تسجيل جديد</a></li>
                    <li><a href="Contact.html">تواصل معنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="track-section">

        <h2 class="title">تتبع مسار الرحلة</h2>

        <div class="track-container">
            <div class="line"></div>

            <ul class="stations">

                <li class="station completed">
                    <span class="circle">✓</span>
                    <p>القاهرة</p>
                </li>

                <li class="station completed">
                    <span class="circle">✓</span>
                    <p>بنها</p>
                </li>

                <li class="station completed">
                    <span class="circle">✓</span>
                    <p>طنطا</p>
                </li>

                <li class="station current">
                    <span class="circle">•</span>
                    <p>دمنهور</p>
                </li>

                <li class="station">
                    <span class="circle"></span>
                    <p>كفر الدوار</p>
                </li>

                <li class="station">
                    <span class="circle"></span>
                    <p>سيدي جابر</p>
                </li>

                <li class="station">
                    <span class="circle"></span>
                    <p>الإسكندرية</p>
                </li>
            </ul>
        </div>

    </section>


    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2025 قطارات مصر. جميع الحقوق محفوظة.</p>
            <p>تابعنا على: 
                <a href="#">فيسبوك</a> |
                <a href="#">تويتر</a> |
                <a href="#">انستجرام</a>
            </p>
        </div>
    </footer>

</body>
</html>
