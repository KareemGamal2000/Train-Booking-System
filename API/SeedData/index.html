<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث عن رحلات القطار</title>
    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
        }
        .trip-card {
            transition: transform 0.2s, box-shadow 0.2s;
            background-color: white;
            border: 1px solid #e2e8f0;
        }
        .trip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
        }
        /* تصميم زر التبديل الاحترافي (Swap Button) */
        .swap-button {
            z-index: 20;
            top: 50%;
            transform: translateY(-50%);
        }
        /* تصميم الخط الزمني الموجز */
        .summary-timeline-line {
            height: 6px;
            background: linear-gradient(to right, #ef4444, #3b82f6); /* أحمر إلى أزرق */
            border-radius: 9999px;
            position: relative;
            z-index: 10;
        }
        .summary-timeline-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(0, 0, 0, 0.1); /* ظل أبيض خارجي */
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
        }
        
        /* تصميم الخط الزمني التفصيلي */
        .timeline {
            position: relative;
            margin-right: 20px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 2px;
            background-color: #e5e7eb;
        }
        .timeline-item {
            position: relative;
            padding-right: 20px;
            padding-bottom: 20px;
        }
        .timeline-dot-detail {
            position: absolute;
            top: 5px;
            right: -8px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #a5b4fc;
            border: 3px solid white;
            z-index: 10;
        }
        .timeline-time-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem; /* sm */
            color: #4b5563; /* gray-600 */
        }
        .station-name-clickable {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-color: #6366f1; /* Indigo-500 */
            transition: color 0.15s;
        }
        .station-name-clickable:hover {
            color: #4f46e5; /* Indigo-600 */
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6 text-center border-b-4 border-indigo-500 pb-2">
            منظومة البحث عن رحلات القطار
        </h1>

        <!-- واجهة إدخال البحث والتبديل -->
        <div id="searchForm" class="bg-white p-6 rounded-xl shadow-2xl mb-8">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 items-center">
                
                <!-- حقل المغادرة -->
                <div class="md:col-span-2 relative">
                    <label for="departureStation" class="block text-sm font-medium text-gray-700 mb-1">محطة المغادرة</label>
                    <input type="text" id="departureStation" value="السويس"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" required>
                </div>
                
                <!-- زر التبديل -->
                <div class="md:col-span-1 flex justify-center relative h-full">
                    <button id="swapButton" title="تبديل المحطات"
                            class="absolute swap-button bg-white text-indigo-600 p-2 rounded-full border border-gray-300 hover:bg-indigo-50 hover:border-indigo-500 transition duration-150 shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v10.586l3.293-3.293a1 1 0 111.414 1.414l-5 5a1 1 0 01-1.414 0l-5-5a1 1 0 111.414-1.414L9 14.586V4a1 1 0 011-1z" clip-rule="evenodd" transform="rotate(90 10 10)" />
                        </svg>
                    </button>
                </div>

                <!-- حقل الوصول -->
                <div class="md:col-span-2 relative">
                    <label for="arrivalStation" class="block text-sm font-medium text-gray-700 mb-1">محطة الوصول</label>
                    <input type="text" id="arrivalStation" value="القاهرة"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" required>
                </div>
            </div>

            <!-- زر البحث -->
            <button id="searchButton" 
                    class="w-full mt-6 bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 transition duration-150 font-bold shadow-lg">
                ابحث عن الرحلات
            </button>
            
            <!-- رسالة البحث عن محطة -->
             <div id="stationSearchMessage" class="hidden mt-4 text-center bg-yellow-50 p-3 rounded-lg text-yellow-800 border border-yellow-200">
                <span id="stationSearchText"></span>
            </div>
        </div>
        
        <!-- منطقة عرض المعلومات والفلاتر (قائمة منسدلة واحدة للفرز) -->
        <div id="resultsInfo" class="hidden flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-md mb-6">
            <p id="totalResultsCount" class="text-lg font-bold text-gray-700 mb-4 md:mb-0"></p>
            
            <div class="flex items-center gap-4">
                <label for="sortSelect" class="text-sm font-medium text-gray-600 whitespace-nowrap">فرز حسب:</label>
                
                <select id="sortSelect" class="appearance-none bg-white border border-gray-300 text-gray-700 py-2 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 transition duration-150 shadow-sm">
                    <option value="none">لا فرز (حسب الجلب)</option>
                    <option value="earliest">أبكر وقت مغادرة</option>
                    <option value="latest">أحدث وقت مغادرة</option>
                    <option value="fastest">الأسرع (أقصر مدة)</option>
                    <option value="slowest">الأبطأ (أطول مدة)</option>
                    <option value="fewest">الأقل وقفات</option>
                    <option value="most">الأكثر وقفات</option>
                </select>
                
                <!-- أيقونة سهم القائمة المنسدلة - لتجميل شكل القائمة -->
                <div class="pointer-events-none absolute right-3 flex items-center px-2 text-gray-700">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                </div>
            </div>
        </div>


        <!-- منطقة عرض النتائج -->
        <div id="resultsContainer" class="grid grid-cols-1 gap-6">
            <div id="initialMessage" class="col-span-1 text-center bg-blue-50 p-6 rounded-lg text-gray-600 border border-blue-200">
                <p>يرجى إدخال محطتي المغادرة والوصول للبدء في البحث.</p>
            </div>
        </div>

        <!-- شريط التحميل (Loading Indicator) -->
        <div id="loadingIndicator" class="hidden text-center mt-10">
            <svg class="animate-spin h-10 w-10 text-indigo-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-indigo-600 mt-2 font-semibold" id="loadingText">جاري الاتصال بقاعدة البيانات والبحث عن الرحلات... قد تستغرق عملية الجلب بضع ثوانٍ.</p>
        </div>
        
        <!-- منطقة رسائل الخطأ -->
        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4" role="alert">
            <strong class="font-bold">خطأ في الجلب: </strong>
            <span id="errorText" class="block sm:inline"></span>
        </div>
    </div>
    
    <!-- نافذة المودال لعرض المسار الكامل -->
    <div id="timelineModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true">
            <div class="p-6">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="text-xl font-bold text-gray-800" id="modalTitle">مسار الرحلة بالتفصيل</h3>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-800 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <div id="modalBody" class="text-gray-700">
                    <!-- محتوى الخط الزمني يوضع هنا -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const departureInput = document.getElementById('departureStation');
            const arrivalInput = document.getElementById('arrivalStation');
            const searchButton = document.getElementById('searchButton');
            const swapButton = document.getElementById('swapButton');
            const resultsContainer = document.getElementById('resultsContainer');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const loadingText = document.getElementById('loadingText');
            const errorMessageDiv = document.getElementById('errorMessage');
            const errorTextSpan = document.getElementById('errorText');
            const initialMessage = document.getElementById('initialMessage');
            const totalResultsCount = document.getElementById('totalResultsCount');
            const resultsInfo = document.getElementById('resultsInfo');
            const stationSearchMessage = document.getElementById('stationSearchMessage');
            const stationSearchText = document.getElementById('stationSearchText');


            const modal = document.getElementById('timelineModal');
            const modalBody = document.getElementById('modalBody');
            const closeModal = document.getElementById('closeModal');
            
            const sortSelect = document.getElementById('sortSelect'); // القائمة المنسدلة الجديدة

            const API_BASE_URL = 'https://localhost:7192'; 
            let fetchedTrips = []; // لتخزين جميع الرحلات المجلوبة
            let currentSearchType = 'normal'; // 'normal' or 'segment'
            let currentSegmentStartStation = ''; // تخزين المحطة التي بدأ منها البحث المقسم
            let debounceTimer; // لـ Debounce

            /**
             * دالة Debounce لتأخير التنفيذ، مما يحسن الأداء
             */
            function debounce(func, delay) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(func, delay);
            }

            // **************** الدوال المساعدة ****************

            /**
             * دالة تبديل محتويات حقول المغادرة والوصول
             */
            function handleSwap() {
                const depValue = departureInput.value;
                departureInput.value = arrivalInput.value;
                arrivalInput.value = depValue;
            }

            /**
             * يحول الوقت من تنسيق HH:mm:ss إلى عدد دقائق في اليوم (لغرض الفرز)
             */
            function timeToMinutes(timeStr) {
                if (!timeStr) return -1; // -1 للقيم الفارغة أو الخاطئة
                try {
                    const [h, m, s] = timeStr.split(':').map(Number);
                    return h * 60 + m;
                } catch {
                    return -1;
                }
            }

            /**
             * يعرض رسالة خطأ أو رسالة عدم وجود نتائج
             */
            function showMessage(type, message, hideStationMessage = true) {
                if (initialMessage) initialMessage.classList.add('hidden');
                resultsContainer.innerHTML = '';
                loadingIndicator.classList.add('hidden');
                resultsInfo.classList.add('hidden');
                totalResultsCount.textContent = '';
                if (hideStationMessage) stationSearchMessage.classList.add('hidden');

                if (type === 'error') {
                    errorMessageDiv.classList.remove('hidden');
                    errorTextSpan.textContent = message;
                } else if (type === 'no_results') {
                    errorMessageDiv.classList.add('hidden');
                    resultsContainer.innerHTML = `
                        <div class="col-span-1 bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 rounded-lg" role="alert">
                            <p class="font-bold">عفواً!</p>
                            <p>${message}</p>
                        </div>
                    `;
                } else {
                    errorMessageDiv.classList.add('hidden');
                }
            }

            /**
             * تنسيق الوقت من HH:mm:ss إلى hh:mm ص/م
             */
            function formatTime(timeStr) {
                if (!timeStr) return '---';
                try {
                    const [h, m, s] = timeStr.split(':').map(Number);
                    const hours = h % 12 || 12;
                    const ampm = h < 12 || h === 24 ? 'ص' : 'م';
                    const minutes = m.toString().padStart(2, '0');
                    return `${hours}:${minutes}${ampm}`; 
                } catch {
                    return timeStr; 
                }
            }
            
            /**
             * يحسب المدة الزمنية بين نقطتين بالتنسيق "ساعة ودقيقة"
             */
            function calculateDuration(depTimeStr, arrTimeStr) {
                if (!depTimeStr || !arrTimeStr) return { durationText: 'N/A', totalMinutes: Infinity };
                
                try {
                    const depMinutes = timeToMinutes(depTimeStr);
                    let arrMinutes = timeToMinutes(arrTimeStr);

                    // التعامل مع حالات اليوم التالي
                    if (arrMinutes < depMinutes) {
                        arrMinutes += (24 * 60); 
                    }

                    const diffMinutes = arrMinutes - depMinutes;
                    const hours = Math.floor(diffMinutes / 60);
                    const minutes = diffMinutes % 60;
                    
                    let durationText = '';

                    if (hours > 0) {
                        // إذا كانت المدة ساعة أو أكثر
                        durationText += `${hours} س`;
                        if (minutes > 0) {
                            durationText += ` و ${minutes} د`;
                        }
                    } else if (minutes > 0) {
                        // إذا كانت أقل من ساعة (فقط دقائق)
                        durationText = `${minutes} دقيقة`;
                    } else {
                        // أقل من دقيقة
                        durationText = 'أقل من دقيقة';
                    }

                    return { durationText, totalMinutes: diffMinutes };
                } catch {
                    return { durationText: 'N/A', totalMinutes: Infinity }; 
                }
            }
            
            /**
             * دالة جديدة: لجلب الرحلات المارة بمحطة معينة
             */
            async function searchTripsByStation(stationName) {
                if (!stationName) return;
                
                currentSearchType = 'segment';
                currentSegmentStartStation = stationName;

                // تحديث رسالة شريط التحميل
                loadingText.textContent = `جاري البحث عن جميع الرحلات المارة بمحطة: ${stationName}...`;
                stationSearchText.textContent = `عرض الرحلات المارة بمحطة: ${stationName} (المحطة الجديدة للانطلاق)`;
                stationSearchMessage.classList.remove('hidden');

                // إخفاء النتائج السابقة وعرض شريط التحميل
                errorMessageDiv.classList.add('hidden');
                if (initialMessage) initialMessage.classList.add('hidden');
                resultsContainer.innerHTML = '';
                resultsInfo.classList.add('hidden');
                loadingIndicator.classList.remove('hidden');

                const url = `${API_BASE_URL}/api/Trip/search/station?stationName=${encodeURIComponent(stationName)}`;
                
                try {
                    const response = await fetch(url);
                    loadingIndicator.classList.add('hidden');
                    
                    const responseText = await response.text();
                    
                    if (!response.ok) {
                        let errorMsg = `فشل جلب البيانات. رمز الخطأ: ${response.status}.`;
                        try {
                            const errorData = JSON.parse(responseText);
                            errorMsg = errorData.title || errorMsg;
                        } catch {
                            errorMsg += " الخادم أرجع استجابة غير متوقعة.";
                        }
                        showMessage('error', errorMsg, false); // لا تخفي رسالة البحث عن محطة
                        return;
                    }
                    
                    // تحويل الاستجابة إلى مصفوفة حتى لو كانت عنصر واحد
                    let trips = [];
                    if (responseText && responseText.trim() !== '') {
                        const data = JSON.parse(responseText);
                        if (Array.isArray(data)) {
                            trips = data;
                        } else if (data && typeof data === 'object') {
                            // إذا أرجع الـ API عنصر واحد وليس مصفوفة، نضعه في مصفوفة
                            trips = [data]; 
                        }
                    }
                    

                    if (trips.length === 0) {
                        showMessage('no_results', `لم يتم العثور على رحلات تمر بمحطة ${stationName}.`, false);
                        return;
                    }
                    
                    // تجهيز البيانات للفرز والعرض بناءً على المحطة الجديدة كبداية
                    const processedTrips = trips.map(trip => {
                        // نستخدم المحطة التي تم النقر عليها كنقطة انطلاق جديدة
                        const depName = stationName;
                        // ونستخدم المحطة الأخيرة في الرحلة كنقطة وصول
                        const stops = trip.stops || [];
                        const arrName = stops[stops.length - 1]?.stationNameAR || 'المحطة الأخيرة';
                        
                        // هنا نستخدم الدالة المحدثة لإنشاء البطاقة، والتي ستحسب المدة والوقت بناءً على depName و arrName
                        createSummaryCard(trip, depName, arrName, true); 
                        return trip;
                    });


                    fetchedTrips = processedTrips;
                    renderTrips(processedTrips, true); // استخدام مسار مختلف لعرض النتائج

                } catch (error) {
                    console.error('Fetch Error:', error);
                    loadingIndicator.classList.add('hidden');
                    showMessage('error', `حدث خطأ غير متوقع أثناء معالجة البيانات المرتجعة. (${error.message})`, false);
                }
            }
            window.searchTripsByStation = searchTripsByStation; // جعل الدالة متاحة عالمياً


            /**
             * ينشئ محتوى الخط الزمني المفصل للمودال.
             */
            function createTimelineContent(stops, depName, arrName) {
                if (!stops || stops.length === 0) return '<p class="text-sm text-red-500">لا تتوفر بيانات توقفات مفصلة.</p>';
                
                const normalize = (name) => name ? name.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').trim().toLowerCase() : '';
                const normalizedDep = normalize(depName);
                const normalizedArr = normalize(arrName);

                // البحث عن تسلسل المحطات الفعلية
                const actualDepStop = stops.find(s => s && (normalize(s.stationNameAR) === normalizedDep || normalize(s.stationNameEN) === normalizedDep || normalize(s.shortName) === normalizedDep));
                const actualArrStop = stops.find(s => s && (normalize(s.stationNameAR) === normalizedArr || normalize(s.stationNameEN) === normalizedArr || normalize(s.shortName) === normalizedArr));

                const depSequence = actualDepStop?.stopSequence || 0;
                const arrSequence = actualArrStop?.stopSequence || stops.length - 1;

                const filteredStops = stops
                    .filter(s => s.stopSequence >= depSequence && s.stopSequence <= arrSequence)
                    .sort((a, b) => a.stopSequence - b.stopSequence);

                const timelineHtml = filteredStops.map((stop, index) => {
                    // تحديد ما إذا كانت المحطة الحالية هي نقطة الانطلاق أو الوصول الجديدة (المحددة في البطاقة)
                    const isDeparture = stop.stopSequence === depSequence;
                    const isArrival = stop.stopSequence === arrSequence;
                    
                    const stationName = stop.stationNameAR || 'N/A'; // استخدام اسم المحطة
                    
                    // نجعل جميع المحطات قابلة للنقر عدا نقطة الانطلاق الجديدة ونقطة الوصول النهائية
                    // عند النقر، يتم البحث من المحطة التي تم النقر عليها إلى نهاية المسار (نهاية الرحلة الأصلية)
                    const isStationNameClickable = !isDeparture && !isArrival; 

                    let dotClass = 'timeline-dot-detail bg-gray-400';
                    let stationDetail = '';
                    
                    if (isDeparture) {
                        dotClass = 'timeline-dot-detail bg-indigo-600';
                        stationDetail = `<span class="text-xs font-bold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded-full mr-2">انطلاق (بدء المسار)</span>`;
                    } else if (isArrival) {
                        dotClass = 'timeline-dot-detail bg-red-600';
                        stationDetail = `<span class="text-xs font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded-full mr-2">وصول (نهاية المسار)</span>`;
                    } else {
                         dotClass = 'timeline-dot-detail bg-green-500';
                    }

                    const stationNameElement = isStationNameClickable 
                        ? `<p class="font-semibold text-gray-800 station-name-clickable" onclick="searchTripsByStation('${stationName}'); closeModal.click();">${stationName}</p>`
                        : `<p class="font-semibold text-gray-800">${stationName}</p>`;


                    const arrivalTime = formatTime(stop.arrivalTime);
                    const departureTime = formatTime(stop.departureTime);

                    return `
                        <div class="timeline-item">
                            <div class="${dotClass}"></div>
                            <div class="flex flex-col items-start">
                                <div class="flex items-center mb-1">
                                    ${stationNameElement}
                                    ${stationDetail}
                                </div>
                                <div class="timeline-time-info">
                                    ${stop.arrivalTime ? `
                                        <div class="flex items-center">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                            <span class="mr-1">${arrivalTime} وصول</span>
                                        </div>` : ''}
                                    ${stop.departureTime ? `
                                        <div class="flex items-center">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                            <span class="mr-1">${departureTime} مغادرة</span>
                                        </div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `<div class="timeline p-3">${timelineHtml}</div>`;
            }

            /**
             * ينشئ بطاقة العرض المختصرة (Summary Card)
             */
            function createSummaryCard(trip, depName, arrName, isStationSearch = false) {
                const stops = trip.stops || [];

                // 1. تحديد محطتي الانطلاق والوصول الفعليتين في قائمة التوقفات
                const normalize = (name) => name ? name.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').trim().toLowerCase() : '';
                const normalizedDep = normalize(depName);
                const normalizedArr = normalize(arrName);

                // البحث عن المحطتين بناءً على الأسماء (المستخدمة في واجهة العرض)
                const depStop = stops.find(s => s && (normalize(s.stationNameAR) === normalizedDep || normalize(s.stationNameEN) === normalizedDep || normalize(s.shortName) === normalizedDep));
                const arrStop = stops.find(s => s && (normalize(s.stationNameAR) === normalizedArr || normalize(s.stationNameEN) === normalizedArr || normalize(s.shortName) === normalizedArr));

                // إذا كنا في حالة بحث مقطع، يتم حساب الأوقات من نقطة الانطلاق الجديدة
                let departureTime = depStop ? depStop.departureTime : null;
                let arrivalTime = arrStop ? arrStop.arrivalTime : null;

                // إذا كانت نقطة الانطلاق في المنتصف، فنحن نحتاج إلى وقت المغادرة منها
                if (depStop && depStop.departureTime) {
                    departureTime = depStop.departureTime;
                }
                // وإذا كانت نقطة الوصول في المنتصف، فنحن نحتاج إلى وقت الوصول إليها
                if (arrStop && arrStop.arrivalTime) {
                    arrivalTime = arrStop.arrivalTime;
                }
                
                const formattedDepartureTime = formatTime(departureTime);
                const formattedArrivalTime = formatTime(arrivalTime);

                // 2. حساب المدة والوقفات
                const { durationText, totalMinutes } = calculateDuration(departureTime, arrivalTime);
                
                // عدد الوقفات (المحطات بين نقطة الانطلاق والوصول المعروضة)
                const depSequence = depStop?.stopSequence || 0;
                const arrSequence = arrStop?.stopSequence || stops.length - 1;
                
                const totalStopsCount = stops
                    .filter(s => s.stopSequence >= depSequence && s.stopSequence <= arrSequence)
                    .length;
                const intermediateStops = totalStopsCount > 0 ? totalStopsCount - 2 : 0;
                
                // 3. استخراج الفئات المتاحة
                const availableClasses = trip.availableClasses || [];
                const availableClassesHtml = availableClasses.map(c => `
                    <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-0.5 rounded-full shadow-sm">${c.classNameAR}</span>
                `).join(' ');

                // 4. استخراج أرخص فئة وسعر
                let cheapestPrice = Infinity;
                let cheapestClass = 'N/A';
                
                trip.segmentPrices?.forEach(p => {
                    if (p.price < cheapestPrice) {
                        cheapestPrice = p.price;
                        // نبحث عن اسم الفئة المقابل في availableClasses
                        const classObj = availableClasses.find(c => c.classID === p.classID);
                        cheapestClass = classObj ? classObj.classNameAR : 'N/A';
                    }
                });

                const priceDisplay = cheapestPrice !== Infinity ? `${cheapestPrice.toFixed(2)} ج.م` : 'N/A';
                
                // إضافة البيانات لأغراض الفرز
                trip.sortDuration = totalMinutes;
                trip.sortStops = intermediateStops;
                trip.sortDepartureTimeMinutes = timeToMinutes(departureTime); 
                
                
                // تحديد المحطات القابلة للنقر: المحطة المغادرة الجديدة والمحطة الوصول النهائية للرحلة
                const departureNameElement = (isStationSearch && depSequence !== 0) // إذا كان بحث مقطع وليس بداية الرحلة
                    ? `<span class="text-xs text-gray-900 mt-1.5 font-bold text-indigo-600">${depName}</span>` // نقطة انطلاق جديدة غير قابلة للنقر
                    : `<span class="text-xs text-gray-900 mt-1.5">${depName}</span>`;
                
                const arrivalNameElement = (isStationSearch && arrSequence !== stops.length - 1) // إذا كانت ليست نهاية الرحلة (للتنبيه فقط)
                    ? `<span class="text-xs text-gray-900 mt-1.5 font-bold text-red-600">${arrName}</span>` // نقطة وصول جديدة غير قابلة للنقر
                    : `<span class="text-xs text-gray-900 mt-1.5">${arrName}</span>`; // نقطة وصول نهائية


                return `
                    <div class="trip-card p-6 rounded-xl shadow-lg transition duration-300 w-full" 
                         data-trip-id="${trip.trip_ID}">
                        
                        <!-- الصف العلوي: رقم القطار وعدد وقفات القطار -->
                        <div class="flex justify-between items-center mb-4">
                            <!-- اليمين: رقم القطار -->
                            <div class="flex items-center text-gray-700 space-x-2 rtl:space-x-reverse font-bold">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                                <span>${trip.trainName || 'N/A'}</span>
                            </div>
                            <!-- اليسار: عدد وقفات القطار (تنسيق جمالي: الجملة أولاً ثم الرقم) -->
                            <div class="text-gray-700 font-semibold flex flex-col items-end text-sm">
                                <!-- السطر الأول: العبارة الوصفية -->
                                <span class="text-base text-gray-600 font-bold">عدد وقفات المسار</span>
                                <!-- السطر الثاني: الرقم الفعلي -->
                                <span class="text-2xl font-extrabold text-gray-800 -mt-1">${intermediateStops}</span>
                            </div>
                        </div>

                        <!-- الخط الزمني الموجز -->
                        <div class="relative flex items-center my-8 h-6">
                            
                            <!-- محطة الوصول (اليسار) -->
                            <div class="absolute left-0 top-0 flex flex-col items-start text-red-600 space-y-0">
                                <span class="text-2xl font-extrabold">${formattedArrivalTime}</span>
                                ${arrivalNameElement}
                            </div>
                            
                            <!-- محطة المغادرة (اليمين) -->
                            <div class="absolute right-0 top-0 flex flex-col items-end text-blue-600 space-y-0">
                                <span class="text-2xl font-extrabold">${formattedDepartureTime}</span>
                                ${departureNameElement}
                            </div>
                            
                            <!-- الخط والمدة -->
                            <div class="absolute left-1/2 transform -translate-x-1/2 w-4/5">
                                <div class="summary-timeline-line"></div>
                                
                                <!-- **تم تثبيت المدة فوق الشريط** -->
                                <span class="absolute top-[-1.5rem] left-1/2 transform -translate-x-1/2 text-sm font-semibold text-gray-700 bg-white px-2 py-0.5 rounded shadow-md border border-gray-200 z-30">${durationText}</span>
                                
                                <div class="summary-timeline-dot bg-red-600 left-0"></div>
                                <div class="summary-timeline-dot bg-blue-600 right-0"></div>
                            </div>
                        </div>
                        
                        <!-- الصف السفلي: الفئة والسعر وزر التفاصيل -->
                        <div class="flex justify-between items-start pt-14 border-t border-gray-100">
                            
                            <!-- اليسار: الفئات المتاحة -->
                            <div class="flex flex-col items-start space-y-2">
                                <span class="text-xs font-medium text-gray-600">الفئات المتاحة:</span>
                                <div class="flex flex-wrap gap-2 items-center pt-1">
                                    ${availableClassesHtml || '<span class="text-xs text-red-500">لا توجد فئات متاحة.</span>'}
                                </div>
                            </div>

                            <!-- اليمين: الفئة الأرخص والسعر -->
                            <div class="flex flex-col items-end space-y-1 text-right">
                                <span class="text-xs text-gray-500 font-medium">الفئة الأرخص: <span class="text-green-600 font-bold">${cheapestClass}</span></span>
                                <span class="text-xs text-gray-500 font-medium">السعر: <span class="text-green-600 font-bold">${priceDisplay}</span></span>
                            </div>
                        </div>
                        
                        <!-- زر عرض المسار -->
                        <button onclick="showTimelineModal(${trip.trip_ID})"
                                class="w-full mt-4 py-2 bg-gray-100 text-indigo-600 font-semibold rounded-lg hover:bg-gray-200 transition duration-150 shadow-sm">
                            عرض المسار بالكامل
                        </button>
                    </div>
                `;
            }

            // **************** الدوال الرئيسية ****************
            
            /**
             * تطبيق الفرز وعرض النتائج
             */
            function renderTrips(trips, isSegmentSearch = false) {
                const depName = isSegmentSearch ? currentSegmentStartStation : departureInput.value.trim();
                // في حالة بحث المقاطع، يجب تمرير محطة الوصول النهائية لكل رحلة بشكل صحيح
                // ولكن لأغراض الفرز والعرض، نعتمد على البيانات المحسوبة والمخزنة في trip objects
                
                // قراءة قيمة الفرز المختارة من القائمة المنسدلة
                const sortType = sortSelect.value;
                
                // 1. تطبيق الفرز فقط إذا لم يكن الخيار هو 'none'
                if (sortType !== 'none') {
                    trips.sort((a, b) => {
                        let compare = 0;

                        switch (sortType) {
                            case 'earliest':
                                // أبكر وقت مغادرة
                                compare = a.sortDepartureTimeMinutes - b.sortDepartureTimeMinutes;
                                break;
                            case 'latest':
                                // أحدث وقت مغادرة
                                compare = b.sortDepartureTimeMinutes - a.sortDepartureTimeMinutes;
                                break;
                            case 'fastest':
                                // الأسرع (أقصر مدة)
                                compare = a.sortDuration - b.sortDuration;
                                break;
                            case 'slowest':
                                // الأبطأ (أطول مدة)
                                compare = b.sortDuration - a.sortDuration;
                                break;
                            case 'fewest':
                                // الأقل وقفات
                                compare = a.sortStops - b.sortStops;
                                break;
                            case 'most':
                                // الأكثر وقفات
                                compare = b.sortStops - a.sortStops;
                                break;
                            default:
                                compare = 0; // لا فرز
                        }

                        // في حالة التساوي، نترك الترتيب كما هو
                        return compare;
                    });
                }
                
                
                // 2. عرض النتائج
                resultsContainer.innerHTML = trips.map(trip => {
                    // نستخدم أسماء المحطات المخزنة في الـ trip object بعد معالجتها في searchTripsByStation
                    const tripStops = trip.stops || [];
                    const finalArrName = tripStops[tripStops.length - 1]?.stationNameAR || 'المحطة الأخيرة';

                    return createSummaryCard(trip, depName, finalArrName, isSegmentSearch);
                }).join('');
                
                // 3. تحديث الإحصائيات
                totalResultsCount.textContent = `تم العثور على ${trips.length} رحلة`;
                resultsInfo.classList.remove('hidden');
                errorMessageDiv.classList.add('hidden');
            }
            
            // ربط حدث التغيير للقائمة المنسدلة باستخدام Debounce
            sortSelect.addEventListener('change', () => {
                if (fetchedTrips.length > 0) {
                    // تأخير التنفيذ لمدة 200 مللي ثانية لتحسين الأداء أثناء تفاعل المستخدم
                    debounce(() => {
                        const isSegmentSearch = currentSearchType === 'segment';
                        renderTrips([...fetchedTrips], isSegmentSearch);
                    }, 200);
                }
            });


            searchButton.addEventListener('click', async () => {
                const departure = departureInput.value.trim();
                const arrival = arrivalInput.value.trim();

                if (!departure || !arrival) {
                    showMessage('error', 'يرجى إدخال محطتي المغادرة والوصول.');
                    return;
                }
                
                currentSearchType = 'normal'; // إعادة تعيين نوع البحث للبحث العادي
                stationSearchMessage.classList.add('hidden'); // إخفاء رسالة بحث المحطة
                errorMessageDiv.classList.add('hidden');
                if (initialMessage) initialMessage.classList.add('hidden');
                resultsContainer.innerHTML = '';
                resultsInfo.classList.add('hidden');
                loadingIndicator.classList.remove('hidden');
                loadingText.textContent = 'جاري الاتصال بقاعدة البيانات والبحث عن الرحلات... قد تستغرق عملية الجلب بضع ثوانٍ.';

                const url = `${API_BASE_URL}/api/Trip/search/alltrips?departureStationName=${encodeURIComponent(departure)}&arrivalStationName=${encodeURIComponent(arrival)}`;

                try {
                    const response = await fetch(url);

                    loadingIndicator.classList.add('hidden');
                    
                    const responseText = await response.text();
                    
                    if (!response.ok) {
                        let errorMsg = `فشل جلب البيانات. رمز الخطأ: ${response.status}.`;
                        try {
                            const errorData = JSON.parse(responseText);
                            errorMsg = errorData.title || errorMsg;
                        } catch {
                            errorMsg += " الخادم أرجع استجابة غير متوقعة.";
                        }
                        showMessage('error', errorMsg);
                        return;
                    }
                    
                    if (!responseText || responseText.trim() === '[]') {
                        showMessage('no_results', 'لم يتم العثور على رحلات بين المحطتين المحددة. يرجى التحقق من أسماء المحطات.');
                        return;
                    }
                    
                    const trips = JSON.parse(responseText);

                    if (trips.length === 0) {
                        showMessage('no_results', 'لم يتم العثور على رحلات بين المحطتين المحددة. يرجى التحقق من أسماء المحطات.');
                        return;
                    }
                    
                    // تجهيز البيانات للفرز والعرض (مثل حساب المدة والوقفات)
                    const processedTrips = trips.map(trip => {
                        createSummaryCard(trip, departure, arrival); // يتم حساب الـ sortDuration/sortStops هنا
                        return trip;
                    });


                    fetchedTrips = processedTrips;
                    renderTrips(processedTrips, false); // بحث عادي: المحطات غير قابلة للنقر

                } catch (error) {
                    console.error('Fetch Error:', error);
                    loadingIndicator.classList.add('hidden');
                    showMessage('error', `حدث خطأ غير متوقع أثناء معالجة البيانات المرتجعة. (${error.message})`);
                }
            });

            // **************** أحداث المودال والتبديل ****************

            window.showTimelineModal = (tripId) => {
                const trip = fetchedTrips.find(t => t.trip_ID === tripId);
                
                const isSegmentSearch = currentSearchType === 'segment';
                
                if (trip) {
                    let depName, arrName;
                    
                    if (isSegmentSearch) {
                        depName = currentSegmentStartStation;
                        // ومحطة الوصول هي المحطة النهائية للرحلة
                        arrName = trip.stops[trip.stops.length - 1]?.stationNameAR || 'المحطة الأخيرة';
                    } else {
                        // في حالة البحث العادي، نستخدم محطتي الإدخال في نموذج البحث
                        depName = departureInput.value.trim();
                        arrName = arrivalInput.value.trim();
                    }

                    // عرض المسار بناءً على نقاط البداية والنهاية المحسوبة
                    modalBody.innerHTML = createTimelineContent(trip.stops, depName, arrName);
                    document.getElementById('modalTitle').textContent = `مسار الرحلة رقم ${trip.trainName || tripId}`;
                    modal.classList.remove('hidden');
                    modal.classList.add('flex');
                }
            };
            
            closeModal.addEventListener('click', () => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('flex');
                    modal.classList.add('hidden');
                }
            });

            swapButton.addEventListener('click', handleSwap);
        });
    </script>
</body>
</html>
